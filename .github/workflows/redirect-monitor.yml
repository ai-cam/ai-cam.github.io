name: Redirect Health Monitor

on:
  # Run every three days to catch regressions during the CIP-0001
  # two-week monitoring window, then weekly thereafter.
  schedule:
    - cron: '0 7 * * 1,4'   # 07:00 UTC on Monday and Thursday
  # Allow a manual run at any time from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  redirect-smoke-test:
    name: Redirect smoke test (live site)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run redirect tests
        id: redirects
        run: |
          python3 tests/test_redirects.py \
            --base-url https://www.ai.cam.ac.uk \
            --timeout 20
        # Continue so we can open an issue even when the test fails
        continue-on-error: true

      - name: Open a GitHub issue on failure
        if: steps.redirects.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[Redirect Monitor] Broken redirect(s) detected — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## Redirect health check failed',
              '',
              `One or more \`redirect_from\` entries on the live site returned a non-200 status.`,
              '',
              '**Run:** ' + context.runId,
              '**Workflow:** ' + context.workflow,
              '',
              '### What to do',
              '',
              '1. Open the failing workflow run to see which URLs returned 404.',
              '2. Check whether the corresponding content file still has a `redirect_from` entry for that URL.',
              '3. If the redirect has been deliberately removed, close this issue.',
              '4. Otherwise, re-add the `redirect_from` entry or fix the slug causing the 404.',
              '',
              'Run locally to reproduce:',
              '```',
              'python3 tests/test_redirects.py --base-url https://www.ai.cam.ac.uk',
              '```',
              '',
              'Related: CIP-0001 (slug migration monitoring)',
            ].join('\n');

            // Check for an existing open issue with the same title prefix to avoid duplicates
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'redirect-monitor',
            });

            const alreadyOpen = issues.some(i => i.title.startsWith('[Redirect Monitor]'));
            if (!alreadyOpen) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['redirect-monitor', 'bug'],
              });
            }

      - name: Fail the job if tests failed
        if: steps.redirects.outcome == 'failure'
        run: exit 1
