name: Branch Protection Validation

on:
  # Trigger on push to main branch
  push:
    branches:
      - main
  # Trigger on pull request targeting main
  pull_request:
    branches:
      - main
  # Schedule daily validation at 2 AM UTC
  schedule:
    - cron: '0 2 * * *'
  # Allow manual triggering
  workflow_dispatch:

env:
  GITHUB_REPOSITORY: ${{ github.repository }}

jobs:
  validate-branch-protection:
    name: Validate Branch Protection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: read
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check branch rules
        id: check-protection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/configure-branch-protection.py \
            --repo "$GITHUB_REPOSITORY" \
            --branch main > protection-check.log 2>&1 || true
          cat protection-check.log
          if grep -q "NOT compliant" protection-check.log; then
            echo "violations_detected=true" >> $GITHUB_OUTPUT
          else
            echo "violations_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Create issue on violations
        if: steps.check-protection.outputs.violations_detected == 'true' && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const logContent = fs.readFileSync('protection-check.log', 'utf8');

            const title = '⚠️ Branch Ruleset Rules Non-Compliant';
            const body = `## Branch Ruleset Validation Failed

            The automated validation detected that the main branch ruleset rules are not compliant with the required configuration.

            ### Details
            \`\`\`
            ${logContent}
            \`\`\`

            ### Action Required
            Please review and update the branch ruleset settings manually in **GitHub Settings → Rules**.

            This issue was automatically created by the Branch Protection Validation workflow.
            `;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'branch-protection'
            });

            const existingIssue = issues.data.find(issue => issue.title === title);

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['branch-protection', 'security', 'automated']
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `## Update: ${new Date().toISOString()}\n\n${body}`
              });
            }
  
  security-monitor:
    name: Security Event Monitoring
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run security monitoring
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Pass event JSON via env var so shell quoting does not break on
          # internal double-quotes in the JSON payload.
          GH_EVENT_DATA: ${{ toJson(github.event) }}
        run: |
          python scripts/security-monitor.py \
            --repo "$GITHUB_REPOSITORY" \
            --event-type "${{ github.event_name }}" \
            --event-data "$GH_EVENT_DATA"

