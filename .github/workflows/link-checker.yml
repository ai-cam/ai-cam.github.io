name: Broken Link Checker

on:
  # Run weekly on Sunday morning so results are ready for the working week.
  schedule:
    - cron: '0 6 * * 0'
  # Allow a manual run from the Actions tab at any time.
  workflow_dispatch:

jobs:
  check-links:
    name: Check live site for broken internal links
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # lychee is a fast link checker written in Rust.
      # We point it at the live sitemap so it follows every published URL.
      - name: Run lychee link checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --base https://www.ai.cam.ac.uk
            --include-verbatim
            --exclude-all-private
            --exclude "^mailto:"
            --exclude "^tel:"
            --exclude "linkedin\.com"
            --exclude "twitter\.com"
            --exclude "x\.com"
            --exclude "facebook\.com"
            --timeout 20
            --retry-wait-time 5
            --max-retries 2
            --verbose
            https://www.ai.cam.ac.uk/sitemap.xml
          fail: false   # we open an issue instead of failing immediately
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open a GitHub issue on failure
        if: steps.lychee.outputs.exit_code != 0
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[Link Checker] Broken links detected — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## Broken links detected on the live site',
              '',
              'The weekly link checker found one or more URLs that return a non-200 status.',
              '',
              '**Run:** ' + context.runId,
              '**Full report:** see the lychee step output in the workflow run above.',
              '',
              '### What to do',
              '',
              '1. Open the workflow run and expand the **Run lychee link checker** step.',
              '2. Identify which internal URLs are returning 404.',
              '3. Check whether a `redirect_from` entry is missing, or whether the content file has been renamed/deleted.',
              '4. Fix the source content or add a redirect, then close this issue.',
              '',
              'To reproduce locally:',
              '```bash',
              'npx lychee --base https://www.ai.cam.ac.uk https://www.ai.cam.ac.uk/sitemap.xml',
              '```',
              '',
              'Related: CIP-0001 (slug migration), redirect-monitor workflow',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'broken-links',
            });

            const alreadyOpen = issues.some(i => i.title.startsWith('[Link Checker]'));
            if (!alreadyOpen) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['broken-links', 'bug'],
              });
            }

      - name: Fail job if broken links were found
        if: steps.lychee.outputs.exit_code != 0
        run: exit 1
